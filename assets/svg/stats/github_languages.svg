<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 200" width="100%" height="100%">
  <defs><style type="text/css">
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
  .card-bg { fill: #09090b; stroke: #27272a; stroke-width: 1; rx: 8px; }
  .header-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600; fill: #f4f4f5; letter-spacing: 0.04em; text-transform: uppercase; }
  .label-text { font-family: 'JetBrains Mono', monospace, ui-monospace; font-size: 11px; font-weight: 500; fill: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
  .value-text { font-family: 'JetBrains Mono', monospace, ui-monospace; font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: -0.02em; }
  .divider-line { stroke: #1f1f23; stroke-width: 1; }
</style></defs>
  <rect width="100%" height="100%" class="card-bg" />
  <line x1="0" y1="0" x2="36" y2="0" stroke="#52525b" stroke-width="1.5" />
  <circle cx="20" cy="24" r="3" fill="#d4d4d8" />
  <text x="32" y="28" class="header-title">Language Distribution</text>
  <line x1="20" y1="42" x2="410" y2="42" class="divider-line" />
  <g transform="translate(24, 66)">
    <g transform="translate(0, 0)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d8">TypeScript</text>
      <rect x="130" y="2" width="180" height="7" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.75" />
      <rect x="130" y="2" width="101" height="7" rx="3" fill="#ffffff" />
      <text x="375" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717a" text-anchor="end">56%</text>
    </g>
    <g transform="translate(0, 23)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d8">JavaScript</text>
      <rect x="130" y="2" width="180" height="7" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.75" />
      <rect x="130" y="2" width="42" height="7" rx="3" fill="#e4e4e7" />
      <text x="375" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717a" text-anchor="end">22.8%</text>
    </g>
    <g transform="translate(0, 46)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d8">CSS</text>
      <rect x="130" y="2" width="180" height="7" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.75" />
      <rect x="130" y="2" width="14" height="7" rx="3" fill="#a1a1aa" />
      <text x="375" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717a" text-anchor="end">7.4%</text>
    </g>
    <g transform="translate(0, 69)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d8">Python</text>
      <rect x="130" y="2" width="180" height="7" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.75" />
      <rect x="130" y="2" width="13" height="7" rx="3" fill="#71717a" />
      <text x="375" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717a" text-anchor="end">6.7%</text>
    </g>
    <g transform="translate(0, 92)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4d4d8">Dart</text>
      <rect x="130" y="2" width="180" height="7" rx="3" fill="#141416" stroke="#27272a" stroke-width="0.75" />
      <rect x="130" y="2" width="4" height="7" rx="3" fill="#52525b" />
      <text x="375" y="10" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717a" text-anchor="end">2.1%</text>
    </g></g>
