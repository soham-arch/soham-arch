<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <defs>
    <style type="text/css">
      
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
  
  .card-bg {
    fill: #ffffff;
    stroke: #e2e8f0;
    stroke-width: 1.5;
    rx: 12px;
  }
  .header-title {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 700;
    fill: #0a0a0a;
    letter-spacing: 0.02em;
  }
  .label-text {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 400;
    fill: #64748b;
  }
  .value-text {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 18px;
    font-weight: 700;
    fill: #0a0a0a;
  }

    </style>
  </defs>

  <rect width="100%" height="100%" class="card-bg" />
  <path d="M 20 0 L 100 0" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" />

  <!-- Header -->
  <circle cx="20" cy="30" r="4" fill="#0a0a0a" />
  <text x="32" y="34" class="header-title">Top Languages</text>

  <!-- Language List -->
  <g transform="translate(25, 62)">
    
    <g transform="translate(0, 0)">
      <!-- Language Name -->
      <text x="0" y="11" class="label-text" font-size="11.5">Python</text>
      
      <!-- Progress Bar Track -->
      <rect x="110" y="2" width="150" height="8" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5" />
      
      <!-- Progress Bar Fill -->
      <rect x="110" y="2" width="73" height="8" rx="4" fill="#3572A5" />
      
      <!-- Percentage Text -->
      <text x="270" y="11" class="label-text" font-size="11" fill="#64748b">48.5%</text>
    </g>
    
    <g transform="translate(0, 24)">
      <!-- Language Name -->
      <text x="0" y="11" class="label-text" font-size="11.5">TypeScript</text>
      
      <!-- Progress Bar Track -->
      <rect x="110" y="2" width="150" height="8" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5" />
      
      <!-- Progress Bar Fill -->
      <rect x="110" y="2" width="34" height="8" rx="4" fill="#3178C6" />
      
      <!-- Percentage Text -->
      <text x="270" y="11" class="label-text" font-size="11" fill="#64748b">22.1%</text>
    </g>
    
    <g transform="translate(0, 48)">
      <!-- Language Name -->
      <text x="0" y="11" class="label-text" font-size="11.5">JavaScript</text>
      
      <!-- Progress Bar Track -->
      <rect x="110" y="2" width="150" height="8" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5" />
      
      <!-- Progress Bar Fill -->
      <rect x="110" y="2" width="25" height="8" rx="4" fill="#F1E05A" />
      
      <!-- Percentage Text -->
      <text x="270" y="11" class="label-text" font-size="11" fill="#64748b">16.4%</text>
    </g>
    
    <g transform="translate(0, 72)">
      <!-- Language Name -->
      <text x="0" y="11" class="label-text" font-size="11.5">C++</text>
      
      <!-- Progress Bar Track -->
      <rect x="110" y="2" width="150" height="8" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5" />
      
      <!-- Progress Bar Fill -->
      <rect x="110" y="2" width="14" height="8" rx="4" fill="#F34B7D" />
      
      <!-- Percentage Text -->
      <text x="270" y="11" class="label-text" font-size="11" fill="#64748b">9%</text>
    </g>
    
    <g transform="translate(0, 96)">
      <!-- Language Name -->
      <text x="0" y="11" class="label-text" font-size="11.5">HTML/CSS</text>
      
      <!-- Progress Bar Track -->
      <rect x="110" y="2" width="150" height="8" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.5" />
      
      <!-- Progress Bar Fill -->
      <rect x="110" y="2" width="6" height="8" rx="4" fill="#563D7C" />
      
      <!-- Percentage Text -->
      <text x="270" y="11" class="label-text" font-size="11" fill="#64748b">4%</text>
    </g>
    
  </g>
</svg>