<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap');
      
      .title-text {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 52px;
        fill: #0a0a0a;
        letter-spacing: -0.03em;
      }
      
      .subtitle-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: #0a0a0a;
        letter-spacing: -0.01em;
      }

      .tagline-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #64748b;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      
      /* Cycling Text Animation — KEPT per user request */
      .cycle-text {
        opacity: 0;
        animation: textCycle 9s infinite;
      }
      
      .cycle-1 { animation-delay: 0s; }
      .cycle-2 { animation-delay: 3s; }
      .cycle-3 { animation-delay: 6s; }
      
      @keyframes textCycle {
        0% { opacity: 0; transform: translateY(8px); }
        5% { opacity: 1; transform: translateY(0px); }
        28% { opacity: 1; transform: translateY(0px); }
        33% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; }
      }

      /* Cursor blinking */
      .cursor {
        animation: blink 0.8s infinite;
        fill: #0a0a0a;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background — Clean white/off-white, no grid, no animated shapes -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Subtle accent line at top -->
  <path d="M 30 0 L 200 0" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- BRAND NAME & DETAILS -->
  <g transform="translate(60, 0)">
    <!-- Tagline above name -->
    <text x="0" y="65" class="tagline-text">BUILDING INTELLIGENT PRODUCTS</text>
    
    <!-- Name — dominant display text -->
    <text x="0" y="125" class="title-text">Soham Patil</text>

    <!-- Cycling Subtitle — TYPING ANIMATION PRESERVED -->
    <g transform="translate(0, 170)">
      <!-- Minimal prompt indicator -->
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#94a3b8">› </text>
      
      <!-- Subheading 1 -->
      <text x="22" y="0" class="subtitle-text cycle-text cycle-1">AI Engineer</text>
      <!-- Subheading 2 -->
      <text x="22" y="0" class="subtitle-text cycle-text cycle-2">Full Stack Developer</text>
      <!-- Subheading 3 -->
      <text x="22" y="0" class="subtitle-text cycle-text cycle-3">Building Intelligent Products</text>

      <!-- Cursor -->
      <rect x="290" y="-18" width="2" height="22" class="cursor" rx="1" />
    </g>

    <!-- Brief Bio Description -->
    <text x="0" y="210" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="400">
      AI Engineering · Computer Vision · Full Stack Development
    </text>
  </g>
</svg>
