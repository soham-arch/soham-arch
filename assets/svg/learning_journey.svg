<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="100%" height="100%">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap');
      
      .milestone-title {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #0a0a0a;
      }
      
      .milestone-detail {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12px;
        fill: #64748b;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Vertical Timeline Line -->
  <line x1="40" y1="50" x2="40" y2="610" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- NODE 1: Started Programming -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="50" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" />
    <circle cx="40" cy="50" r="2.5" fill="#0a0a0a" />
    
    <!-- Milestone title -->
    <text x="70" y="46" class="milestone-title">Started Programming</text>
    
    <!-- Milestone detail -->
    <text x="70" y="64" class="milestone-detail">Learned algorithms and core computer science fundamentals.</text>
  </g>
  
  <!-- NODE 2: Android Development -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="130" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="40" cy="130" r="2.5" fill="#3b82f6" />
    
    <!-- Milestone title -->
    <text x="70" y="126" class="milestone-title">Android Development</text>
    
    <!-- Milestone detail -->
    <text x="70" y="144" class="milestone-detail">Built native mobile experiences and mobile user interactions.</text>
  </g>
  
  <!-- NODE 3: Firebase -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="210" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" />
    <circle cx="40" cy="210" r="2.5" fill="#0a0a0a" />
    
    <!-- Milestone title -->
    <text x="70" y="206" class="milestone-title">Firebase</text>
    
    <!-- Milestone detail -->
    <text x="70" y="224" class="milestone-detail">Architected real-time synchronizations and serverless databases.</text>
  </g>
  
  <!-- NODE 4: Full Stack -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="290" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="40" cy="290" r="2.5" fill="#3b82f6" />
    
    <!-- Milestone title -->
    <text x="70" y="286" class="milestone-title">Full Stack</text>
    
    <!-- Milestone detail -->
    <text x="70" y="304" class="milestone-detail">Developed responsive web architectures and solid REST API backends.</text>
  </g>
  
  <!-- NODE 5: AI Projects -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="370" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" />
    <circle cx="40" cy="370" r="2.5" fill="#0a0a0a" />
    
    <!-- Milestone title -->
    <text x="70" y="366" class="milestone-title">AI Projects</text>
    
    <!-- Milestone detail -->
    <text x="70" y="384" class="milestone-detail">Transitioned to building intelligent products using deep neural networks.</text>
  </g>
  
  <!-- NODE 6: Computer Vision -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="450" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="40" cy="450" r="2.5" fill="#3b82f6" />
    
    <!-- Milestone title -->
    <text x="70" y="446" class="milestone-title">Computer Vision</text>
    
    <!-- Milestone detail -->
    <text x="70" y="464" class="milestone-detail">Worked with CNNs, face embeddings, and real-time image processing.</text>
  </g>
  
  <!-- NODE 7: RAG Architectures -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="530" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" />
    <circle cx="40" cy="530" r="2.5" fill="#0a0a0a" />
    
    <!-- Milestone title -->
    <text x="70" y="526" class="milestone-title">RAG Architectures</text>
    
    <!-- Milestone detail -->
    <text x="70" y="544" class="milestone-detail">Integrated vector search engines with LLMs to query domain-specific data.</text>
  </g>
  
  <!-- NODE 8: Agentic AI -->
  <g>
    <!-- Node circle -->
    <circle cx="40" cy="610" r="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="40" cy="610" r="2.5" fill="#3b82f6" />
    
    <!-- Milestone title -->
    <text x="70" y="606" class="milestone-title">Agentic AI</text>
    
    <!-- Milestone detail -->
    <text x="70" y="624" class="milestone-detail">Building autonomous, tool-calling multi-agent execution graphs.</text>
  </g>
  
</svg>