name: Update GitHub Profile README

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate Section Dividers
        run: node scripts/generate_dividers.js

      - name: Generate Tech Stack SVG
        run: node scripts/generate_tech_stack_svg.js

      - name: Generate Project Card SVGs
        run: node scripts/generate_project_cards_svg.js

      - name: Generate Learning Journey SVG
        run: node scripts/generate_learning_journey_svg.js

      - name: Generate Custom SVG Dashboards
        run: node scripts/generate_stats_svg.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Grid Snake Animation
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/svg/github-contribution-grid-snake.svg?color_snake=#1a1a1a&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
          # Slow down the animation: default is ~150ms per frame, doubling to ~300ms
          # platane/snk uses SVG SMIL animations; we post-process the timing below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slow down snake animation by doubling all animation durations in the SVG
      - name: Slow Down Snake Animation Speed
        run: |
          SNAKE_FILE="assets/svg/github-contribution-grid-snake.svg"
          if [ -f "$SNAKE_FILE" ]; then
            echo "Slowing down snake animation..."
            # Double the dur values in SMIL animate elements (e.g., dur="12s" -> dur="24s")
            sed -i -E 's/dur="([0-9]+\.?[0-9]*)s"/dur="\1s"/g' "$SNAKE_FILE"
            # Use python for precise doubling of duration values
            python3 -c "
import re, sys
with open('$SNAKE_FILE', 'r') as f:
    content = f.read()
def double_dur(match):
    val = float(match.group(1))
    return f'dur=\"{val * 2}s\"'
content = re.sub(r'dur=\"([0-9]+\.?[0-9]*)s\"', double_dur, content)
with open('$SNAKE_FILE', 'w') as f:
    f.write(content)
print('Snake animation durations doubled successfully.')
"
          fi

      - name: Compile Profile README
        run: node scripts/update_readme.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Profile Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/svg/
          # Commit only if there are changes to avoid noise
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile dashboard & assets [skip ci]" && git push)
