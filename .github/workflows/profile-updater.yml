name: Update GitHub Profile README

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'assets/svg/**'
      - 'generated/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Public Repositories
        run: node scripts/fetch_repositories.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Hero Banner SVG
        run: node scripts/generate_hero_svg.js

      - name: Generate Tech Stack SVG
        run: node scripts/generate_tech_stack_svg.js

      - name: Generate Stats SVG Dashboards
        run: node scripts/generate_stats_svg.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Grid Snake Animation
        uses: platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/svg/github-contribution-grid-snake.svg?color_snake=#d4d4d8&color_dots=#121214,#18181b,#27272a,#52525b,#a1a1aa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Slow down snake animation by doubling SMIL durations
      - name: Slow Down Snake Animation Speed
        continue-on-error: true
        run: |
          SNAKE_FILE="assets/svg/github-contribution-grid-snake.svg"
          if [ -f "$SNAKE_FILE" ]; then
            python3 -c "
          import re
          with open('$SNAKE_FILE', 'r') as f: content = f.read()
          def double_dur(m):
              return f'dur=\"{float(m.group(1)) * 2}s\"'
          content = re.sub(r'dur=\"([0-9]+\.?[0-9]*)s\"', double_dur, content)
          with open('$SNAKE_FILE', 'w') as f: f.write(content)
          print('Snake animation durations doubled.')
          "
          fi

      - name: Compile Profile README
        run: node scripts/update_readme.js

      - name: Commit and Push Profile Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/svg/ generated/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: auto-update profile dashboard & repositories [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
